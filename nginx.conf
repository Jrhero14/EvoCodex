worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    client_max_body_size 100M;
    sendfile on;
    keepalive_timeout 180;

    server {
        listen 80;
        server_name localhost;

        # ==========================================
        # COCOINDEX FRONTEND (React)
        # ==========================================
        location / {
            proxy_pass http://host.docker.internal:3001; # Port frontend
            
            # WebSocket & HMR Support untuk Vite/React
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ==========================================
        # WEBSOCKET (Job Status Updates)
        # ==========================================
        location /api/ws/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;  # Keep WS alive for 24h
            proxy_send_timeout 86400s;
        }

        # ==========================================
        # COCOINDEX BACKEND (FastAPI)
        # ==========================================
        # Blok-blok di bawah ini mengarahkan request API spesifik ke backend port 8000
        
        location /api/ {
            proxy_pass http://host.docker.internal:8000;  # TANPA slash (/) di akhir

            # Nonaktifkan cache
            proxy_no_cache 1;
            proxy_cache_bypass 1;

            # Header untuk menonaktifkan cache
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            # CORS headers
            add_header 'Access-Control-Allow-Origin' 'http://localhost' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSL configuration
            proxy_ssl_server_name on;
            proxy_ssl_verify off;  # Nonaktifkan verifikasi SSL untuk development
        }
    }
}
